apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playwright-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/andres4715-gif/playwright_Docker_CI-CD_example.git'
    targetRevision: HEAD
    path: ./k8s/overlays/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true