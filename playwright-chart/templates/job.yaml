apiVersion: batch/v1
kind: Job
metadata:
  # Release name to be unique
  name: {{ .Release.Name }}-job
spec:
  template:
    spec:
      containers:
        - name: executor
          # Read the file values.yaml
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c", "{{ .Values.command }}"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
      restartPolicy: Never