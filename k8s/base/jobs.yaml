apiVersion: batch/v1
kind: Job
metadata:
  name: job-playwright-01
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      containers:
      - name: mi-playwright-container1
        image: playwright:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: config-app-vi
        command: ["npx", "playwright", "test"] 
      restartPolicy: Never

---

