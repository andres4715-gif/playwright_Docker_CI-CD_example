apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: preprod

nameSuffix: -preprod

commonLabels:
  environment: preprod
  project: playwright-tests

images:
  - name: playwright:latest
    newName: ghcr.io/andres4715-gif/playwright_docker_ci-cd_example
    newTag: v1.0-rc1

configMapGenerator:
  - name: config-app-vi
    behavior: merge                # Merge with the existing one (only changes what we list below)
    literals:
      - color_fondo="verde"
      - nivel_log="info"
      - database_host="10.100.0.5"