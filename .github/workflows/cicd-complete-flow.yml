name: CI/CD Complete flow (Tests + Docker)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # -----------------------------------------------------------------
  # WORKFLOW 1: EL INSPECTOR (Playwright Tests)
  # -----------------------------------------------------------------
  test-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers 
        run: npx playwright install --with-deps

      - name: Run Tests
        run: npx playwright test

      # (Optional) Save the HTML report if the tests fail
      - name: Save HTML Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5

  # -----------------------------------------------------------------
  # wORKFLOW 2: THE CONSTRUCTOR (Docker Build & Push)
  # -----------------------------------------------------------------
  build-and-push:
    # The constructor job depends on the inspector
    # If the test job fails, if the test fails this job also fails. and never starts. 
    needs: test-execution 
    
    runs-on: ubuntu-latest
    if: github.event_name == 'push' 
    
    permissions:
      contents: read
      packages: write 

    steps:
      - name: Download code
        uses: actions/checkout@v4

      # Change the repository name to lowercase
      - name: Convert repository name to lowercase
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Loging to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}