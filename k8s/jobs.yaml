apiVersion: batch/v1
kind: Job
metadata:
  name: job-playwright-01
spec:
  template:
    spec:
      containers:
      - name: mi-playwright-container1
        image: playwright:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: config-app-vi
        command: ["npx", "playwright", "test"] 
      restartPolicy: Never

---

