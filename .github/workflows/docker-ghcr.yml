name: publish Docker image into GitHub

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Define the image name it manages all the lowercase name of the image
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write 

    steps:
      - name: pull code
        uses: actions/checkout@v4

      - name: Login into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # if the event is push in the master branch, add 'latest'
            type=raw,value=latest,enable=${{ github.ref == 'format:refs/heads/master' }}
            # Use the sha of the commit (for the history)
            type=sha
            # if the pull request is a PR, use the PR number (ej: pr-2)
            type=ref,event=pr
            # if the event is a normal branch, use the branch name
            type=ref,event=branch

      - name: Build and publish image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 3. Use the output of the `meta` step as inputs
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}